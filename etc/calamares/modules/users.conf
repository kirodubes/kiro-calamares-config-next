defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - power
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - sys
    - optical
    - scanner
    - rfkill
    - i2c

autologinGroup:  autologin

doAutologin:     false

sudoersGroup:    wheel

sudoersConfigureWithGroup: true

setRootPassword: true

doReusePassword: true

user:
  shell: /bin/fish
  home_permissions: "o700"
  # Every system account a stock Kiro install actually creates (taken from
  # /etc/passwd on an installed system, uid < 1000), plus nobody. Without this
  # the installer accepts e.g. "http" or "git", then useradd refuses the name
  # mid-install — this catches it on the users page with a clear message instead.
  forbidden_names:
    - alpm
    - avahi
    - bin
    - colord
    - cups
    - daemon
    - dbus
    - dnsmasq
    - flatpak
    - ftp
    - git
    - http
    - libvirt-qemu
    - mail
    - named
    - nbd
    - nm-openconnect
    - nm-openvpn
    - nobody
    - nvidia-persistenced
    - openvpn
    - partimag
    - pcscd
    - polkitd
    - qemu
    - root
    - rpc
    - rpcuser
    - saned
    - sddm
    - systemd-coredump
    - systemd-imds
    - systemd-journal-remote
    - systemd-network
    - systemd-oom
    - systemd-resolve
    - systemd-timesync
    - tss
    - usbmux
    - uuidd

avatarFilePath: ~/.face

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "kiro-${cpu}"
  forbidden_names: [ localhost, localhost.localdomain, local ]
