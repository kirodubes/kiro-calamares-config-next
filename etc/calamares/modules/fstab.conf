# Creates /etc/fstab and /etc/crypttab in the target system.
#
# This module reads exactly TWO keys: crypttabOptions and tmpOptions.
# Per-filesystem mount options are NOT configured here — the mount module
# computes them from mount.conf and hands them over in global storage as
# mountOptionsList, which this module reads back. Anything else added to this
# file is silently ignored: schema validation is CI-only, so a stale key never
# warns. (fstab.conf previously carried mountOptions, efiMountOptions and
# ssdExtraMountOptions; all three were removed upstream on 2021-12-26 by commit
# 03f2e4560 "[mount,fstab] Move mounting logic to the mount module" and had been
# doing nothing here ever since.)

# Additional options added to each line in /etc/crypttab.
crypttabOptions: luks

# How /etc/fstab handles /tmp.
#
# Only consulted when the ROOT disk is non-rotational; on a spinning root disk
# no /tmp line is written at all and systemd's own tmp.mount applies. The values
# below are the ones Calamares would fall back to internally when this key is
# absent, so behaviour is unchanged — it is spelled out here because tmpOptions
# is required by fstab.schema.yaml, and because /tmp landing on tmpfs should be
# a decision recorded in this file rather than a default inherited from
# Calamares' source.
#
# No size= is set, so the tmpfs gets the kernel default of 50% of RAM. Note this
# fstab entry supersedes systemd's tmp.mount. Machines that build large trees in
# /tmp on low-RAM hardware are the case to watch.
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
